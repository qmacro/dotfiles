base = "ocean"
syntax = "base16-ocean.dark"

# Dracula Theme for leaf
# https://draculatheme.com/spec
#
# Install:
#   cp dracula.toml ~/.config/leaf/themes/dracula.toml
#
# Then in ~/.config/leaf/config.toml:
#   theme = "themes/dracula.toml"
#
# Palette:
#   background   #282A36
#   current_line #353747  (opaque fallback)
#   selection    #44475A
#   foreground   #F8F8F2
#   comment      #6272A4
#   red          #FF5555
#   orange       #FFB86C
#   yellow       #F1FA8C
#   green        #50FA7B
#   cyan         #8BE9FD
#   purple       #BD93F9
#   pink         #FF79C6

[ui]
content_bg            = "#282A36"
toc_bg                = "#21222C"
toc_border            = "#44475A"
scrollbar_hover       = "#BD93F9"
status_bg             = "#21222C"
status_separator      = "#44475A"
status_brand_fg       = "#282A36"
status_brand_bg       = "#BD93F9"
status_filename_fg    = "#F8F8F2"
status_filename_bg    = "#44475A"
status_watch_fg       = "#50FA7B"
status_watch_bg       = "#21222C"
status_reloaded_fg    = "#282A36"
status_reloaded_bg    = "#50FA7B"
status_search_fg      = "#F1FA8C"
status_search_bg      = "#44475A"
status_success_fg     = "#50FA7B"
status_success_bg     = "#21222C"
status_warning_fg     = "#FFB86C"
status_error_fg       = "#FF5555"
status_error_bg       = "#21222C"
status_shortcut_fg    = "#6272A4"
status_percent_fg     = "#BD93F9"
status_dot_fg         = "#6272A4"
toc_hover_fg          = "#F8F8F2"
toc_header_fg         = "#6272A4"
toc_active_bg         = "#44475A"
toc_inactive_bg       = "#21222C"
